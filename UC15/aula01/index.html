<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha primeira página</title>
</head>
<body>
<H1>Jhonathan</H1>   <!--<H1> - cabeçalho-->
<P><h2>Dia dos professores</h2></P>    <!-- <h2> - subcabeçalho-->
<P><h4>15 de outubro</h4></P> <!--<P> - parágrafo-->
<P><h6>vou trazer presentes pro meu lindo professor</h6></P>
<P>
    As tags de cabeçalho (h1> a h6>) em <b>HTML</b> definem os títulos
     e <i>subtítulos</i> de uma <br>página, criando uma <u>hierarquia</u> de conteúdo 
     para usuários e <s>mecanismos</s> de busca
</P>
<hr> <!-- <hr> - linha horizontal-->
<!-- Tags de formatação: <b> - negrito, <i> - itálico, <u> 
    - sublinhado, <s> - tachado  - <br> = \n-->

</body>
</html>
